name: Screenshots

# Captures every screen of the real app (WebKitGTK under Xvfb), light and dark.
# Each capture is an artifact named `screenshots-<key>`. The key hashes the
# files that decide the pixels, so a source state is captured once:
# - Pull request: captures unless an artifact for its key exists, then lists
#   in the job summary the screens that differ from main.
# - Push to main: reuses the PR's artifact when the merge left the key
#   unchanged, and captures otherwise. The images replace the single commit
#   on the orphan `screenshots` branch, which the README links to. No PNG
#   enters main.
# - Changes outside those files run nothing.

on:
  pull_request:
    paths: &pixels
      - "nodedb-studio/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/screenshots.sh"
      - "scripts/screenshots-diff.sh"
      - ".github/workflows/screenshots.yml"
  push:
    branches: [main]
    paths: *pixels
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  key:
    name: key
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      key: ${{ steps.key.outputs.key }}
      run_id: ${{ steps.key.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4

      # The diff script is left out: it changes the report, not the pixels.
      - id: key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key="$(git ls-tree HEAD -- nodedb-studio Cargo.toml Cargo.lock \
            scripts/screenshots.sh .github/workflows/screenshots.yml | git hash-object --stdin)"
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=screenshots-$key" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')"
          if [[ -n "$run_id" ]]; then
            echo "Key \`$key\` was captured by run $run_id. Its images are reused." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  capture:
    name: capture
    needs: key
    if: needs.key.outputs.run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev xvfb fonts-inter fonts-jetbrains-mono

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # The scene list is checked against the mock fixtures. Those tests build
      # only with the feature on Linux, so the macOS CI job does not run them.
      - name: Scene tests
        run: cargo nextest run -p nodedb-studio --features screenshots -E 'test(/^screenshots::/)'

      - name: Capture
        run: scripts/screenshots.sh "$RUNNER_TEMP/screenshots"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ needs.key.outputs.key }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error

  report:
    name: report
    needs: [key, capture]
    if: >-
      always() && github.event_name == 'pull_request'
      && needs.key.result == 'success'
      && (needs.capture.result == 'success' || needs.capture.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: screenshots-${{ needs.key.outputs.key }}
          path: ${{ runner.temp }}/screenshots
          run-id: ${{ needs.key.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Compare with main
        run: |
          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          if git fetch --depth 1 origin screenshots; then
            git archive FETCH_HEAD | tar -x -C "$base"
          fi
          scripts/screenshots-diff.sh "$base" "$RUNNER_TEMP/screenshots" >> "$GITHUB_STEP_SUMMARY"
          echo "Images: artifact \`screenshots-${{ needs.key.outputs.key }}\`." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish
    needs: [key, capture]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.key.result == 'success'
      && (needs.capture.result == 'success' || needs.capture.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screenshots-${{ needs.key.outputs.key }}
          path: screenshots
          run-id: ${{ needs.key.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Replace the screenshots branch
        working-directory: screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q -b screenshots
          git add -A
          tree="$(git write-tree)"
          if git fetch -q --depth 1 "$remote" screenshots &&
             [[ "$(git rev-parse 'FETCH_HEAD^{tree}')" == "$tree" ]]; then
            echo "No screen changed; the branch stays as it is."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "screenshots: ${GITHUB_SHA}"
          git push -q -f "$remote" screenshots
