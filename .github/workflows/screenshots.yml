name: Screenshots

# Captures every screen of the real app (WebKitGTK under Xvfb), light and dark.
# - Pull requests: the images are a workflow artifact, and the job summary
#   lists the screens that differ from main.
# - Pushes to main: the images replace the single commit on the orphan
#   `screenshots` branch, which the README links to. No PNG enters main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev xvfb fonts-inter fonts-jetbrains-mono

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # The scene list is checked against the mock fixtures. Those tests build
      # only with the feature on Linux, so the macOS CI job does not run them.
      - name: Scene tests
        run: cargo nextest run -p nodedb-studio --features screenshots -E 'test(/^screenshots::/)'

      - name: Capture
        run: scripts/screenshots.sh "$RUNNER_TEMP/screenshots"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error

      - name: Compare with main
        if: github.event_name == 'pull_request'
        run: |
          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          if git fetch --depth 1 origin screenshots; then
            git archive FETCH_HEAD | tar -x -C "$base"
          fi
          scripts/screenshots-diff.sh "$base" "$RUNNER_TEMP/screenshots" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish
    needs: capture
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # A newer push supersedes an older one still publishing.
    concurrency:
      group: screenshots-publish
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Replace the screenshots branch
        working-directory: screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q -b screenshots
          git add -A
          tree="$(git write-tree)"
          if git fetch -q --depth 1 "$remote" screenshots &&
             [[ "$(git rev-parse 'FETCH_HEAD^{tree}')" == "$tree" ]]; then
            echo "No screen changed; the branch stays as it is."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "screenshots: ${GITHUB_SHA}"
          git push -q -f "$remote" screenshots
