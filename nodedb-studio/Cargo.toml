[package]
name = "nodedb-studio"
description = "NodeDB Studio — GUI client for NodeDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "nodedb-studio"
path = "src/main.rs"

[dependencies]
nodedb-client = { workspace = true }
nodedb-types = { workspace = true }
dioxus = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
sonic-rs = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

[features]
# Builds the scene runner that captures every screen to PNG
# (`scripts/screenshots.sh`). Linux-only: it snapshots WebKitGTK's own pixels.
# On other targets the feature compiles to nothing.
screenshots = ["dep:webkit2gtk", "dep:cairo-rs"]

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { workspace = true, optional = true }
cairo-rs = { workspace = true, optional = true }

[dev-dependencies]
dioxus-ssr = { workspace = true }
